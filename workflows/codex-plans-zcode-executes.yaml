name: phase2-codex-plans-zcode-executes
description: >
  Phase 2 demo — Codex (参谋) plans, ZCode (执行官, via ACP bridge) modifies
  code, Codex reviews the result. Three roles, three different harnesses.

executor:
  harness: codex

prompt: |
  You are the PLANNER (tech lead). You NEVER edit files yourself — the `worker`
  sub-agent owns all file modifications, the `reviewer` sub-agent owns
  verification. Work the user's goal like this:
  1. PLAN — inspect the workspace, write a short acceptance contract (numbered,
     verifiable criteria).
  2. EXECUTE — call `worker` ONCE with the contract and precise instructions.
  3. REVIEW — call `reviewer` with the contract and the worker's report.
  4. FINISH — report: the plan, the worker's change summary, the reviewer's
     verdict (PASS/FAIL).
  Keep the scope minimal. The workspace is the current working directory.

tools:
  worker:
    type: agent
    description: >
      EXECUTOR — implement the scoped change in the workspace and verify it by
      running the code. This is the only role allowed to modify files.
    prompt: |
      You are the EXECUTOR (执行官). Implement exactly the scoped task you are
      given — nothing more. Modify files only inside the current working
      directory. After editing, run the verification command yourself and
      include the real command output in your report.
      Report: what you changed (file:line) + verification evidence.
    executor:
      harness: acp:zcode
  reviewer:
    type: agent
    description: REVIEWER — verify the change against the acceptance contract. Never edits.
    prompt: |
      You are the REVIEWER. Judge the reported changes ONLY against the
      acceptance contract. Re-run the verification command yourself to confirm.
      Do NOT edit any files. End your report with exactly one line:
      最终判定：PASS or 最终判定：FAIL
    executor:
      harness: codex
